<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <div class="firstHalf">

            <div class="header">

                <div>
                    <h1 class="taskHeading">
                        🚀 Habit Tracker
                    </h1>

                    <p class="quote">
                        Stay consistent every day and build powerful habits.
                    </p>
                </div>

            </div>

            <div class="progress">

                <div class="progressText">

                    <h3>
                        <i class="fa-solid fa-chart-line"></i>
                        Progress
                    </h3>

                    <div class="dataDiv">
                        <span class="data1">0</span>
                        <span>/</span>
                        <span class="data2">0</span>
                        <p>Completed</p>
                    </div>

                </div>

                <div class="progressContainer">
                    <div class="progressBar">
                        0%
                    </div>
                </div>

            </div>

            <div class="inputDiv">

                <input
                    type="text"
                    id="inputHu"
                    placeholder="Add a new habit..." />

                <button id="addBtn">
                    <i class="fa-solid fa-plus"></i>
                </button>

            </div>

        </div>

        <div class="secondHalf">

            <div class="allTasks">

                <!-- Dynamic Tasks Render Here -->

            </div>

        </div>

    </div>

</body>

</html>
